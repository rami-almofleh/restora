# Helm installs files in crds/ once and never upgrades them. hack/dev-install.sh applies this file on every run.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: exports.restora.local
spec:
  group: restora.local
  scope: Namespaced
  names:
    kind: Export
    listKind: ExportList
    plural: exports
    singular: export
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Application
          type: string
          jsonPath: .spec.application
        - name: Location
          type: string
          jsonPath: .spec.locationName
        - name: Taken
          type: date
          jsonPath: .spec.createdAt
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["application", "snapshot", "location", "createdAt", "resourcesSnapshot", "resources", "volumes"]
              description: A backup that is stored in a storage location. It outlives the Snapshot it was made from.
              properties:
                application:
                  type: string
                snapshot:
                  type: string
                location:
                  type: string
                locationName:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                policy:
                  type: object
                  required: ["id", "name"]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                resourcesSnapshot:
                  type: string
                resources:
                  type: object
                  properties:
                    count:
                      type: integer
                    bytes:
                      type: integer
                      format: int64
                addedBytes:
                  type: integer
                  format: int64
                volumes:
                  type: array
                  items:
                    type: object
                    required: ["claim", "kopiaSnapshot", "sizeBytes"]
                    properties:
                      claim:
                        type: string
                      kopiaSnapshot:
                        type: string
                      sizeBytes:
                        type: integer
                        format: int64
