apiVersion: apps/v1
kind: Deployment
metadata:
  name: restora-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restora.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "restora.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "restora.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: restora-api
      # The API reads the cluster (read-only, see rbac.yaml).
      automountServiceAccountToken: true
      containers:
        - name: api
          image: {{ include "restora.image" (dict "root" . "name" .Values.api.imageName) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RESTORA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "restora.containerSecurityContext" . | nindent 12 }}
