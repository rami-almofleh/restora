# One account per component, so the API never gets the controller's right to read Secrets.
# Pods opt in to the token themselves.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restora-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restora.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restora-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restora.labels" . | nindent 4 }}
automountServiceAccountToken: false
